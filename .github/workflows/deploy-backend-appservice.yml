name: Deploy Backend (Azure App Service)

on:
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/deploy-backend-appservice.yml
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Resolve Config
        id: cfg
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          APP_NAME="${{ vars.AZURE_WEBAPP_NAME }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="${{ secrets.AZURE_WEBAPP_NAME }}"
          fi
          if [ -z "$APP_NAME" ]; then
            echo "Missing app name: set Actions Variable AZURE_WEBAPP_NAME (recommended) or Secret AZURE_WEBAPP_NAME."
            exit 1
          fi
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo "Missing publish profile: set Secret AZURE_WEBAPP_PUBLISH_PROFILE."
            exit 1
          fi
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

          SLOT_NAME="${{ vars.AZURE_WEBAPP_SLOT_NAME }}"
          echo "slot_name=$SLOT_NAME" >> "$GITHUB_OUTPUT"

      - name: Install, Typecheck, Build (server)
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm prune --omit=dev

      - name: Deploy (production)
        if: steps.cfg.outputs.slot_name == ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.cfg.outputs.app_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./server

      - name: Deploy (slot)
        if: steps.cfg.outputs.slot_name != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.cfg.outputs.app_name }}
          slot-name: ${{ steps.cfg.outputs.slot_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./server
