name: Deploy Backend (Azure App Service)

on:
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/deploy-backend-appservice.yml
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Resolve Config
        id: cfg
        run: |
          APP_NAME="${{ vars.AZURE_WEBAPP_NAME }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="${{ secrets.AZURE_WEBAPP_NAME }}"
          fi
          if [ -z "$APP_NAME" ]; then
            echo "Missing app name: set Actions Variable AZURE_WEBAPP_NAME (recommended) or Secret AZURE_WEBAPP_NAME."
            exit 1
          fi
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

          SLOT_NAME="${{ vars.AZURE_WEBAPP_SLOT_NAME }}"
          echo "slot_name=$SLOT_NAME" >> "$GITHUB_OUTPUT"

      - name: Install, Typecheck, Build (server)
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm prune --omit=dev

      - name: Detect Auth Method
        id: auth
        run: |
          if [ -n "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "method=publish_profile" >> "$GITHUB_OUTPUT"
          else
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (Publish Profile / production)
        if: steps.cfg.outputs.slot_name == '' && steps.auth.outputs.method == 'publish_profile'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.cfg.outputs.app_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./server

      - name: Deploy (Publish Profile / slot)
        if: steps.cfg.outputs.slot_name != '' && steps.auth.outputs.method == 'publish_profile'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.cfg.outputs.app_name }}
          slot-name: ${{ steps.cfg.outputs.slot_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./server

      - name: Azure Login (OIDC)
        if: steps.auth.outputs.method == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (OIDC / production)
        if: steps.cfg.outputs.slot_name == '' && steps.auth.outputs.method == 'oidc'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.cfg.outputs.app_name }}
          package: ./server

      - name: Deploy (OIDC / slot)
        if: steps.cfg.outputs.slot_name != '' && steps.auth.outputs.method == 'oidc'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.cfg.outputs.app_name }}
          slot-name: ${{ steps.cfg.outputs.slot_name }}
          package: ./server
