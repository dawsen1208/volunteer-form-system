name: Deploy Backend (Azure App Service)

on:
  push:
    branches:
      - main
    paths:
      - server/**
      - .github/workflows/deploy-backend-appservice.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Validate Config
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
            echo "Missing GitHub Actions variable: AZURE_WEBAPP_NAME"
            exit 1
          fi

      - name: Install, Typecheck, Build (server)
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm prune --omit=dev

      - name: Deploy (Publish Profile / production)
        if: vars.AZURE_WEBAPP_SLOT_NAME == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./server

      - name: Deploy (Publish Profile / slot)
        if: vars.AZURE_WEBAPP_SLOT_NAME != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./server

      - name: Azure Login (OIDC)
        if: secrets.AZURE_WEBAPP_PUBLISH_PROFILE == ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (OIDC / production)
        if: vars.AZURE_WEBAPP_SLOT_NAME == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./server

      - name: Deploy (OIDC / slot)
        if: vars.AZURE_WEBAPP_SLOT_NAME != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}
          package: ./server
