name: Build & Push Server Image (ACR)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/build-and-push-server-image.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/volunteer-form-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/volunteer-form-api:${{ github.sha }}
